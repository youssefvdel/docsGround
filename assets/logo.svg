<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sheet1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34e0c8"/>
      <stop offset="100%" stop-color="#0fb5a0"/>
    </linearGradient>
    <linearGradient id="sheet2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63d6ff"/>
      <stop offset="100%" stop-color="#2f9be0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9be8ff"/>
      <stop offset="100%" stop-color="#4fd0e8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#06281f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded square base: squircle glass tile -->
  <g filter="url(#shadow)">
    <rect x="48" y="48" width="416" height="416" rx="108" fill="url(#rim)" opacity="0.9"/>
    <rect x="54" y="54" width="404" height="404" rx="102" fill="#0d1f26"/>
  </g>

  <!-- Layered document sheets (the glyph) -->
  <!-- Back sheet (emerald) -->
  <g transform="translate(138 128) rotate(-8 118 128)">
    <rect x="0" y="0" width="236" height="256" rx="26" fill="url(#sheet1)" opacity="0.92"/>
    <rect x="18" y="20" width="92" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
    <rect x="18" y="44" width="140" height="10" rx="5" fill="#ffffff" opacity="0.22"/>
    <rect x="18" y="68" width="120" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Front sheet (cyan) -->
  <g transform="translate(138 128) rotate(6 118 128)">
    <rect x="0" y="0" width="236" height="256" rx="26" fill="url(#sheet2)"/>
    <rect x="18" y="20" width="92" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
    <rect x="18" y="44" width="150" height="10" rx="5" fill="#ffffff" opacity="0.34"/>
    <rect x="18" y="68" width="128" height="10" rx="5" fill="#ffffff" opacity="0.28"/>
    <rect x="18" y="96" width="200" height="10" rx="5" fill="#ffffff" opacity="0.2"/>
    <rect x="18" y="120" width="176" height="10" rx="5" fill="#ffffff" opacity="0.16"/>
    <rect x="18" y="144" width="150" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- Glass highlight sheen -->
  <rect x="70" y="70" width="372" height="190" rx="90" fill="url(#glass)"/>
  <ellipse cx="150" cy="120" rx="90" ry="42" fill="#ffffff" opacity="0.10"/>
</svg>
